services:
  frontend:
    build:
      context: .
      target: development
    init: true
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:
